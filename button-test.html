<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustID Button - Test Page</title>
  <style>
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #fafafa;
      color: #333;
    }
    h1 { font-size: 1.2em; font-weight: 500; margin-bottom: 8px; }
    p { color: #666; font-size: 14px; margin: 0 0 32px 0; }
  </style>
</head>
<body>

  <div id="btn"></div>
  <!-- Use this script in your UI :  -->
  <script
    src="./trustid-oauth.iife.js"
    data-client-id="test-client-id"
    data-redirect-uri="http://localhost:3000/auth/callback"
    data-authorization-endpoint="https://auth.example.com/realms/example/protocol/openid-connect/auth"
    data-container="#btn"
    data-size="large"
    data-idp-hint="trustid"
  ></script>

</body>
</html>
